[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biobank-agent"
version = "2.0.0"
description = "Autonomous scientific discovery agent for population-scale biobank research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "CHEN Pengan", email = "chenpengan@link.cuhk.edu.hk"}]

dependencies = [
    # Data
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pandas>=2.0",
    "numpy>=1.24",
    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Agent
    "openai>=1.50",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    # Analysis
    "lifelines>=0.28",
    "scipy>=1.12",
    "networkx>=3.2",
    # Config
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Web & PDF
    "pymupdf>=1.24",
    "httpx>=0.27",
    "html2text>=2024.2",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
    "catboost>=1.2",
    "shap>=0.44",
    "umap-learn>=0.5",
]
all = [
    "catboost>=1.2",
    "shap>=0.44",
    "umap-learn>=0.5",
]

[project.scripts]
biobank = "biobank_agent.cli:main"

[tool.setuptools.packages.find]
include = ["biobank_agent*"]

[tool.pytest.ini_options]
markers = ["integration: Integration tests requiring real LLM API"]
