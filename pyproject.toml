[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biobank-agent"
version = "2.3.0"
description = "Autonomous scientific discovery agent for population-scale biobank research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "CHEN Pengan", email = "chenpengan@link.cuhk.edu.hk"}]

[project.urls]
Homepage = "https://github.com/cpa2001/BioBank-Agent"
Repository = "https://github.com/cpa2001/BioBank-Agent"
Documentation = "https://github.com/cpa2001/BioBank-Agent/tree/main/docs"

dependencies = [
    # Data
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pandas>=2.0",
    "numpy>=1.24",
    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Agent
    "openai>=1.50",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    # Analysis
    "lifelines>=0.28",
    "scipy>=1.12",
    "networkx>=3.2",
    # Config
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Web & PDF
    "pymupdf>=1.24",
    "httpx>=0.27",
    "html2text>=2024.2",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
    "catboost>=1.2",
    "shap>=0.44",
    "umap-learn>=0.5",
]
verify = [
    "z3-solver>=4.12",
]
graphpop = [
    "neo4j>=5.0",
]
research = [
    "inferactively-pymdp>=0.1",
]
literature = [
    "paper-qa>=5.0",
]
structured = [
    "instructor>=1.0",
]
enrichment = [
    "gseapy>=1.1",
]
single-cell = [
    "cellxgene-census>=1.15; python_version < '3.13'",
]
dev = [
    "coverage>=7.6",
]
all = [
    "catboost>=1.2",
    "shap>=0.44",
    "umap-learn>=0.5",
    "z3-solver>=4.12",
    "neo4j>=5.0",
    "paper-qa>=5.0",
    "instructor>=1.0",
    "gseapy>=1.1",
    "cellxgene-census>=1.15; python_version < '3.13'",
    "coverage>=7.6",
]

[project.scripts]
biobank = "biobank_agent.cli:main"

[tool.setuptools.packages.find]
include = ["biobank_agent*"]

[tool.pytest.ini_options]
markers = ["integration: Integration tests requiring real LLM API"]

[tool.coverage.run]
source = ["biobank_agent"]
branch = true
omit = [
    "biobank_agent/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
