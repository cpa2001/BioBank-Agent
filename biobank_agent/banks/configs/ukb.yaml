# UK Biobank Configuration
# This file defines all UKB-specific schema, column names, and feature groups.
# Other biobanks (FinnGen, CKB, HPP) provide their own YAML files.

bank_id: ukb
display_name: UK Biobank
description: "large-scale prospective cohort study, 500K+ participants aged 40-69 at recruitment (2006-2010)"
caveats: "healthy volunteer cohort with known selection biases; ~94% White British"
coding_system: ICD10

# Schema
patient_id_column: eid
diagnoses_code_column: diag_icd10
deaths_code_column: cause_icd10
field_column_pattern: "{field_id}-{instance}.{array}"
default_instance: 0
default_array: 0

# File naming (UKB-specific parquet names)
biomarker_parquet_name: "ukb.parquet"
diagnoses_parquet_name: "hesin_diag.parquet"
deaths_parquet_name: "death_cause.parquet"
catalog_fields_file: "field.txt"
catalog_categories_file: "category.txt"

