name: Biobank Scheduled Eval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  behavioral-and-evolution-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run scheduled quality gates
        run: |
          python -m biobank_agent.eval.scheduled \
            --behavioral-policy all \
            --output-dir reports/eval/scheduled \
            --behavioral-output-dir reports/eval/behavioral \
            --evolution-output-dir reports/eval/evolution

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biobank-scheduled-eval
          path: reports/eval
